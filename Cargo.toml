[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
osewa-wire = { path = "crates/wire" }
osewa-ghostty = { path = "crates/ghostty" }
osewa-holder = { path = "crates/holder" }
osewa-paths = { path = "crates/paths" }
osewa-flag = { path = "crates/flag" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
rand = "0.8"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
