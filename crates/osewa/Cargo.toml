[package]
name = "osewa"
description = "The single osewa binary: server, holder, enrollment and client commands"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "osewa"
path = "src/main.rs"

[dependencies]
osewa-wire.workspace = true
osewa-ghostty.workspace = true
osewa-holder.workspace = true
osewa-server.workspace = true
osewa-auth.workspace = true

[dev-dependencies]
libc.workspace = true
osewa-client.workspace = true
osewa-mirror.workspace = true
osewa-carrier.workspace = true
tokio = { version = "1", features = ["rt", "time", "macros"] }
