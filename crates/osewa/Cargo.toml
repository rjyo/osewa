[package]
name = "osewa"
description = "The single osewa binary: server, holder, enrollment and client commands"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "osewa"
path = "src/main.rs"

[dependencies]
osewa-wire.workspace = true
osewa-ghostty.workspace = true
osewa-holder.workspace = true
osewa-server.workspace = true
osewa-auth.workspace = true
osewa-client.workspace = true
osewa-mirror.workspace = true
osewa-vt.workspace = true
osewa-paths.workspace = true
libc.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "time", "signal", "macros", "io-util", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# SHA-256 of the build update copies, as install's.
ring = "0.17"

[dev-dependencies]
osewa-carrier.workspace = true
tokio-rustls = { version = "0.26", default-features = false }
