[package]
name = "osewa-carrier"
description = "osewa carriers: frames over WebSocket (docs/PROTOCOL.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
osewa-wire.workspace = true
base64.workspace = true
rand.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
httparse = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["io-util", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "sync", "time", "macros", "rt", "net", "process", "test-util"] }
