[package]
name = "osewa-client"
description = "osewa's client library: connect, attach, resume, channels, hosts and login (no libghostty)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
osewa-wire.workspace = true
osewa-auth.workspace = true
osewa-paths.workspace = true
osewa-carrier.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
# Tests render with libghostty, as the Go client tests do through
# client/mirror; the library itself never links it.
osewa-ghostty.workspace = true
rand.workspace = true
